# NOTE: /api/... is NOT proxied here. The cluster Ingress (Traefik) routes
# /api/menu -> menu-api, /api/orders -> orders-api, /api/stats -> stats-api
# directly, so one image works unchanged in staging and production.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
